server {
    listen 80;
    server_name securatechit.insmvm.linkpc.net localhost;

    root /var/www/html;
    index login.php index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /login.php?$query_string;
    }

    location /api/report.php {
        allow 127.0.0.1;
        allow 10.0.0.0/24;
        deny all;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/report.php;
        fastcgi_pass php:9000;
    }

    location /api/pull_tasks.php {
        allow 127.0.0.1;
        allow 10.0.0.0/24;
        deny all;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/pull_tasks.php;
        fastcgi_pass php:9000;
    }

    location /api/request_backup.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/request_backup.php;
        fastcgi_pass php:9000;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /grafana;

        proxy_redirect off;
    }
}
