name: securetech

services:

  # Base de datos PostgreSQL
  postgres:
    image: postgres:16
    container_name: securetech-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Los scripts de init los crea Dhayan
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d ${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # MinIO: almacenamiento de backups (como un S3 privado)
  minio:
    image: minio/minio:latest
    container_name: securetech-minio
    restart: unless-stopped
    env_file: .env
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # 9000: API S3 (la usan restic y los agentes)
      - "9000:9000"
      # 9001: consola web de MinIO (solo localhost)
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # Crea el bucket y el usuario de MinIO automáticamente al arrancar
  minio_init:
    image: minio/mc:latest
    container_name: securetech-minio-init
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET} || true;
      mc admin user add local ${MINIO_CLIENT_ACCESS_KEY} ${MINIO_CLIENT_SECRET_KEY} || true;
      mc admin policy attach local readwrite --user ${MINIO_CLIENT_ACCESS_KEY} || true;
      exit 0;
      "
    restart: "no"
    networks:
      - backend

  # PHP-FPM: procesa el código PHP del panel
  php:
    build:
      context: ./php
    container_name: securetech-php
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # El código PHP lo crea Dhayan en ./app/
      - ./app:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend

  # Nginx: sirve el panel web
  nginx:
    image: nginx:alpine
    container_name: securetech-nginx
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
      grafana:
        condition: service_started
    volumes:
      - ./app:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Cambia 8080 por el puerto que usa el proxy del instituto (Paso 1)
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Grafana: dashboards con los datos de PostgreSQL
  grafana:
    image: grafana/grafana:latest
    container_name: securetech-grafana
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Le decimos a Grafana que está en el subpath /grafana/
      GF_SERVER_ROOT_URL: https://securatechit.insmvm.linkpc.net/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  grafana_data:

